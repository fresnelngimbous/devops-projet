name: CI-CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
      - run: docker build -t monapp:ci .

  deploy:
    needs: build-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
