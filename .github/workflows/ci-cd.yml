name: CI-CD

on:
  push:
    branches: [principal]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check preview-server.js
      - run: docker build -t monapp:ci .

  deploy:
    needs: build-test
    runs-on: self-hosted
    steps:
      - name: Deploy from local repo
        run: |
          cd /home/vagrant/devops-projet
          git fetch origin principal
          git reset --hard origin/principal
          docker compose up -d --build
